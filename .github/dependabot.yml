version: 2

# The release workflow's actions are pinned to commit SHAs (so a moving
# `@vN` tag can never silently change what runs). Pinning trades "silently
# updated" for "silently stale", so Dependabot watches for new releases and
# opens a PR with the new SHA + version comment.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Monthly cadence with a defined day: 01:00 on the 1st of every month.
      # Plain `interval: monthly` leaves the day-of-month up to Dependabot
      # (GitHub doesn't document it) and `schedule.day` is honoured for
      # weekly intervals only. The cron expression key is `cronjob` — a
      # plain `cron` key is rejected by the schema.
      interval: "cron"
      cronjob: "0 1 1 * *"
      timezone: "Asia/Riyadh"
    # One PR for all pending action bumps instead of up to six.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
