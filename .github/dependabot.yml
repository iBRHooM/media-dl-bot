version: 2

# The release workflow's actions are pinned to commit SHAs (so a moving
# `@vN` tag can never silently change what runs). Pinning trades "silently
# updated" for "silently stale", so Dependabot watches for new releases and
# opens a PR with the new SHA + version comment.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Monthly cadence, but expressed as cron so the day is defined:
      # 01:00 on the 1st of every month. Plain `interval: monthly` leaves
      # the day-of-month up to Dependabot (GitHub doesn't document it), and
      # `schedule.day` is only honoured for weekly intervals.
      interval: "cron"
      cron: "0 1 1 * *"
      timezone: "Asia/Riyadh"
    # One PR for all pending action bumps instead of up to six.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
