version: 2

# The release workflow's actions are pinned to commit SHAs (so a moving
# `@vN` tag can never silently change what runs). Pinning trades "silently
# updated" for "silently stale", so Dependabot watches for new releases and
# opens a PR with the new SHA + version comment.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Only `interval`, `day`, `time` and `timezone` are accepted here —
      # a `cron` key is rejected by Dependabot's schema. `day` is honoured
      # for weekly intervals only, so a monthly check lands on Dependabot's
      # own day-of-month and just the time is ours.
      interval: "monthly"
      time: "01:00"
      timezone: "Asia/Riyadh"
    # One PR for all pending action bumps instead of up to six.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
