services:
  telegram-bot-api:
    # Pinned to the 10.2 multi-arch manifest-list digest (amd64 + arm64)
    # for reproducibility — was floating on :latest. Update deliberately:
    # bump the tag and re-resolve the digest.
    image: aiogram/telegram-bot-api:10.2@sha256:39eb1b74c367e9a2fa7e7185a8e403a29f5c5d7bece8c0b9da441525ac8561c4
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    # No host port publish: the bot reaches this service over the internal
    # compose network (http://telegram-bot-api:8081). Publishing 8081 on
    # the host exposed the Bot API to the whole LAN, where knowledge of
    # the bot token alone is enough to drive it. For occasional local
    # debugging, bind to loopback only: ports: ["127.0.0.1:8081:8081"].
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ 2>&1 | grep -q '404'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Cap resources so a runaway process can't starve the host. The Bot
    # API server is a lean C++ service that streams uploads; 1 GB is
    # generous headroom.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  bot:
    image: ghcr.io/ibrhoom/media-dl-bot:${IMAGE_TAG:-latest}
    container_name: media-dl-bot
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      # API_ID / API_HASH are intentionally NOT passed here — only the
      # telegram-bot-api container needs them. The bot process never reads
      # them, so injecting them would just widen their exposure in
      # `docker inspect` for no reason.
      LOCAL_API_URL: http://telegram-bot-api:8081
      ALLOWED_USERS: ${ALLOWED_USERS}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-1900}
      TZ: ${TZ:-Asia/Riyadh}
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    tmpfs:
      - /tmp
    # Docker's default seccomp policy blocks the user-namespace syscalls
    # Chromium's sandbox needs. This profile is Docker's default allowlist
    # plus clone/setns/unshare (Playwright's official profile), letting the
    # scraper run sandboxed without --no-sandbox or extra capabilities.
    security_opt:
      - seccomp:./seccomp_profile.json
    # Cap resources so a runaway Chromium/ffmpeg/download can't starve the
    # host. Chromium scraping + ffmpeg remuxing + grid rendering fit
    # comfortably in 2 GB; note the tmpfs /tmp above also counts toward
    # this limit. If the container gets OOM-killed under the cap (visible
    # in `docker inspect` / logs), raise memory rather than removing it.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
